scenario: "avalon5"
n_envs: 16
n_steps: 32
n_minibatches: 2
n_epochs_ppo: 2
hidden_dim: 128
policy_lr: 0.0005
gamma: 0.99
gae_lambda: 0.95
ent_coef: 0.02
n_train_epochs: 20000
eval_interval: 500

use_belief_value_critic: true
bos_critic_hidden_dim: 256
bos_critic_depth: 2
bos_critic_lr: 0.001
bos_critic_updates: 2
k: 1
bos_belief_temperature: 1.5
bos_belief_floor: 0.02
bos_likelihood_obs_mode: estimated
bos_obs_estimator_hidden: 128
bos_obs_estimator_lr: 0.001
bos_obs_estimator_updates: 1
dec_head_only: true
bos_shaper_role_only: true
bos_shaper_adapter: true
bos_shaper_adapter_hidden: 64
warmup_epochs: 100
save_dir: ${SCRATCH_ROOT:-/scratch/gilbreth/${USER}/bos_shaping/neurips/results}/checkpoints/camready_avalon5_belief_value_ppo_estimated/
