dec_head_only: true
bos_shaper_role_only: true
bos_shaper_adapter: true
bos_shaper_adapter_hidden: 64
bos_critic_hidden_dim: 256
bos_critic_depth: 2
bos_critic_updates: 2
k: 1
warmup_epochs: 100
save_dir: ${SCRATCH_ROOT:-/scratch/gilbreth/${USER}/bos_shaping/neurips/results}/checkpoints/avalon5_adapter_k1_estimated/
wandb_project: final
